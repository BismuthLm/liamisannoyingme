<!DOCTYPE html>
<html lang="en">
<head>
  <title>DOWNLOAD_TERMINAL - liamisannoying.me</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="Imgs/liamLOGO32.png">
  
  <script src="../download-terminal.js"></script>
  <script>
    // Make sure the function is available globally
    function downloadDesktopApp() {
        // Detect user's platform
        const platform = navigator.platform.toLowerCase();
        let downloadFile = '';
        
        if (platform.includes('mac')) {
            downloadFile = '../LIAMISANNOYING%20Terminal-1.0.0.dmg';
        } else if (platform.includes('win')) {
            // Windows version not available yet
            alert('Windows version coming soon! For now, please use the Mac version.');
            return;
        } else if (platform.includes('linux')) {
            // Linux version not available yet
            alert('Linux version coming soon! For now, please use the Mac version.');
            return;
        } else {
            // Default to web version if platform not detected
            alert('Platform not detected. Please use a Mac to download the desktop app.');
            return;
        }
        
        const link = document.createElement('a');
        link.href = downloadFile;
        link.download = downloadFile.split('/').pop().replace(/%20/g, ' ');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
  </script>
</head>

<body>
  <button onclick="downloadDesktopApp()">
    Download for Mac
  </button>
</body>
</html>
